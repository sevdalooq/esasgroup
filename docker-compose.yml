# Yerel geliştirme: PHP ve Vite host makinede çalışır (php artisan serve / npm run dev),
# sadece altyapı servisleri Docker'da koşar.
services:
    mysql:
        image: mysql:8.0
        container_name: esas-grup-mysql
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: esas_grup
            MYSQL_USER: esas
            MYSQL_PASSWORD: secret
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        container_name: esas-grup-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data

    mailpit:
        image: axllent/mailpit:latest
        container_name: esas-grup-mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: esas-grup-phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: root
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    mysql-data:
    redis-data:
