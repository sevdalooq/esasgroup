name: esas_saha
description: "Esas Grup saha sorumlusu uygulaması – günlük görevler, QR/NFC ile personel giriş-çıkış ve envanter teslim/iade."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  mobile_scanner: ^6.0.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  nfc_manager: ^3.5.0
  web_socket_channel: ^3.0.3
  geolocator: ^14.0.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  # Kurulu Flutter sürümü Color.toARGB32 içermiyor; geolocator_android 5.x bunu gerektiriyor
  geolocator_android: 4.6.2
